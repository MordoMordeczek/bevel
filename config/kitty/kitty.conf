# Bevel rice — kitty
# Colors and font come from bevelctl (Super+I) via the include below.
include bevel-colors.conf

window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
# never join letters (fi, fl, ->) — pixel fonts draw them wrong
disable_ligatures always
cursor_shape block
cursor_blink_interval 0.6
scrollback_lines 5000
hide_window_decorations yes
remember_window_size no

# your own tweaks go below this line
include user.conf
